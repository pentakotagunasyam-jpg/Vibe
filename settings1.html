<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <style>
  *{
    box-sizing:border-box;
  }
  body{
    background-color:black;
    color:white;
    margin:0;
    min-height:100vh;
  }
  .settings{
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:20px;
    position:relative;
  }
  .settings a{
    color:#FB4242;
    font-size:20px;
    text-decoration:none;
    position:absolute;
    left:480px;
    background:transparent;
    -webkit-tap-highlight-color:transparent;
  }
  .settings h1{
    color:white;
    font-weight:bold;
    margin:0;
    font-size:25px;
  }
  .card{
    background-color:black;
    border:none;
    border-radius:15px;
    display:flex;
    align-items:center;
    flex-direction:column;
    gap:50px;
    width:90%;
    max-width:1400px;
    margin:20px auto 0;
  }
  .pt,.na{
    display:flex;
    flex-direction:row;
    justify-content:center;
    gap:30px;
    width:100%;
  }
  .profile,.theme,.notification,.About{
    background-color:#212121;
    width:15%;
    max-width:600px;
    height:80px;
    border:none;
    border-radius:20px;
    padding:20px;
    font-size:18px;
    font-weight:bold;
    display:flex;
    flex-direction:column;
    gap:5px;
    transition: ;
  }
  .profile:hover,.theme:hover,.notification:hover,.About:hover{
    background-color: #E73C3C;
    transform: scale(1.05);



  }
  .profile,.theme,.notification,.About{
    text-decoration:none;
    color:white;
    cursor:pointer;
    transition:0.1s;
    -webkit-tap-highlight-color:transparent;
  }
  .profile:active,.theme:active,.notification:active{
    transform:scale(0.90);
  }
  .button button{
    font-size:14px;
    padding:10px 30px;
    border:none;
    border-radius:15px;
    background-color:#212121;
    margin:50px auto;
    color:#E73C3C;
    width:400px;
    height:40px;
    cursor:pointer;
    transition:0.3s;
  }
  .button button:hover{
    background-color:#E73C3C;
    color:black;
    box-shadow:0px 2px 4px #444040;
    transform:scale(0.97);
  }
  .imge{
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
  }
  .guna{
    display:block;
    width:50%;
    
    height:200px;
    border-radius:15px;
    object-fit:cover;
    margin:20px auto;
  }
  .syam{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    position:absolute;
    top:60px;
  }
  .logout{
    display:flex;
    flex-direction:row;
    justify-content:space-around;
    align-items:center;
  }
  @media (max-width:600px){
    .settings{
      margin-top:20px;
    }
    .settings a{
      font-size:25px;
      left:20px;
    }
    .settings h1{
      font-size:25px;
    }
    .card{
      width:90%;
      gap:30px;
    }
    .pt,.na{
      gap:20px;
      width:100%;
    }
    .profile,.theme,.notification,.About{
      width:calc((100% - 20px)/2);
      height:90px;
      padding:20px;
      font-size:15px;
      border-radius:15px;
    }
    .guna{
      width:90%;
      height:200px;
      margin:20px auto;
    }
    .syam{
      width:105px;
      height:105px;
      top:70px;
    }
    .button button{
      font-size:15px;
      width:80vw;
      max-width:400px;
      height:40px;
      margin:100px auto;
    }
  }
  </style>

  <style>
    :root[data-theme="light"] body { background-color:#f5f5f5 !important; color:#171717 !important; }
    :root[data-theme="light"] .dark, :root[data-theme="light"] .profile, :root[data-theme="light"] .theme, :root[data-theme="light"] .notification, :root[data-theme="light"] .About, :root[data-theme="light"] .email, :root[data-theme="light"] .password, :root[data-theme="light"] .picture, :root[data-theme="light"] .on { background-color:#e6e6e6 !important; color:#171717 !important; }
    :root[data-theme="light"] input { color:#171717; }
  </style>
</head>
<body>
  <div class="settings">
    <a href="#">←</a>
    <h1>Settings</h1>
  </div><br>
  <div class="imge">
    <img class="guna" src="IMG-20260929-WA0037.jpg">
    <img class="syam" data-vibe-avatar src="IMG_20260920_160814835.jpg" alt="Profile picture">
  </div>
  <div class="container">
    <div class="card">
      <div class="pt">
        <a href="profile.html" class="profile">
          <span>Profile</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><title>profile</title><g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"><path d="M16 9a4 4 0 1 1-8 0a4 4 0 0 1 8 0m-2 0a2 2 0 1 1-4 0a2 2 0 0 1 4 0"/><path d="M12 1C5.925 1 1 5.925 1 12s4.925 11 11 11s11-4.925 11-11S18.075 1 12 1M3 12c0 2.09.713 4.014 1.908 5.542A8.99 8.99 0 0 1 12.065 14a8.98 8.98 0 0 1 7.092 3.458A9 9 0 1 0 3 12m9 9a8.96 8.96 0 0 1-5.672-2.012A6.99 6.99 0 0 1 12.065 16a6.99 6.99 0 0 1 5.689 2.92A8.96 8.96 0 0 1 12 21"/></g></svg>
        </a>
        <a href="theme.html" class="theme">
          <span>Theme</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><title>color</title><path fill="currentColor" d="M17.5 12a1.5 1.5 0 0 1-1.5-1.5A1.5 1.5 0 0 1 17.5 9a1.5 1.5 0 0 1 1.5 1.5a1.5 1.5 0 0 1-1.5 1.5m-3-4A1.5 1.5 0 0 1 13 6.5A1.5 1.5 0 0 1 14.5 5A1.5 1.5 0 0 1 16 6.5A1.5 1.5 0 0 1 14.5 8m-5 0A1.5 1.5 0 0 1 8 6.5A1.5 1.5 0 0 1 9.5 5A1.5 1.5 0 0 1 11 6.5A1.5 1.5 0 0 1 9.5 8m-3 4A1.5 1.5 0 0 1 5 10.5A1.5 1.5 0 0 1 6.5 9A1.5 1.5 0 0 1 8 10.5A1.5 1.5 0 0 1 6.5 12M12 3a9 9 0 0 0-9 9a9 9 0 0 0 9 9a1.5 1.5 0 0 0 1.5-1.5c0-.39-.15-.74-.39-1c-.23-.27-.38-.62-.38-1a1.5 1.5 0 0 1 1.5-1.5H16a5 5 0 0 0 5-5c0-4.42-4.03-8-9-8"/></svg>
        </a>
      </div>
      <div class="na">
        <a href="notification.html" class="notification">
          <span>Notification</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        </a>
        <a href="about.html" class="About">
          <span>About</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        </a>
      </div>
    </div>
    <div class="button">
      <div class="logout">
        <button>Logout &nbsp;<svg id="log" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="vibe-settings.js"></script>
</body>
</html>
