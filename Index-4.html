  <style>
    /* =========================
   BODY
========================= */

body {

  background-image:
    url("file_000000006c748211a247756d7731b785.png");

  background-repeat: no-repeat;

  background-size: cover;

  background-position: center;

  background-attachment: fixed;

  min-height: 97vh;

  margin: 0;

  font-family: Arial, sans-serif;

  padding-bottom: 60px;

}


/* =========================
   TOP BAR
========================= */

#one {

  display: flex;

  flex-direction: row;

  justify-content: space-between;

  align-items: center;

  padding: 0 10px;

}
.one1{
  display: flex;
  gap: 8px;
  }
.im{
  width: 20px;
  height: 20px;
  border-radius: 50%;
  margin-top: 3.4px;
  }
/* =========================
   SETTINGS
========================= */

#two {

  margin-top: 3.4px;

  gap: 25px;

}


/* =========================
   SEARCH BOX
========================= */

#three {

  border-radius: 7px;

  margin-left: 5px;

  width: 30%;

  height: 35px;

  border: none;

  padding-left: 10px;

  outline: none;

  box-sizing: border-box;

}


/* Default dark theme */
:root {
  color-scheme: dark;
  --bg: #000000;
  --card: #212121;
  --text: #ffffff;
  --accent: #fb4242;
}

/* Light theme */
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f4f4;
  --card: #e5e5e5;
  --text: #171717;
  --accent: #e73c3c;
}

body {
  background-color: var(--bg);
  color: var(--text);
}

/* Reusable theme colors */
.email,
.password,
.picture,
.card,
.theme,
.notification {
  background-color: var(--card);
  color: var(--text);
}

button {
  color: var(--accent);
}

/* =========================
   GENRE CONTAINER
========================= */

#four {

  display: flex;

  flex-direction: row;

  gap: 5px;

  width: 100%;

  height: 200px;

  overflow-x: auto;

  overflow-y: hidden;

  padding-bottom: 3px;

  box-sizing: border-box;

  scroll-behavior: smooth;

  scrollbar-width: none;

}


#four::-webkit-scrollbar {

  display: none;

}


/* =========================
   GENRE BOXES
========================= */

#five,
#five1,
#five2,
#five3,
#five4,
#five5,
#five6 {

  flex-shrink: 0;

  height: 100%;

  width: 30%;

  margin-left: 15px;

  border-radius: 10px;

  color: white;

  display: flex;

  align-items: flex-end;

  justify-content: center;

  box-sizing: border-box;

  cursor: pointer;

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;

  padding: 5px;

  background-position: center;

}


/* =========================
   GENRE IMAGES
========================= */

#five {

  background-image:
    url("telugu.jpg");

  background-size: cover;

}


#five1 {

  background-image:
    url("hindi.jpg");

  background-size: cover;

}


#five2 {

  background-image:
    url("english.jpg");

  background-size: cover;

}


#five3 {

  background-image:
    url("tamil.jpg");

  background-size: cover;

}


#five4 {

  background-image:
    url("malyalam.webp");

  background-size: cover;

}


#five5 {

  background-image:
    url("kannada.webp");

  background-size: cover;

}


#five6 {

  background-image:
    url("weeknd.jpeg");

  background-size: cover;

}


/* =========================
   GENRE TEXT
========================= */

#five h3,
#five1 h3,
#five2 h3,
#five3 h3,
#five4 h3,
#five5 h3,
#five6 h3 {

  margin: 0;

  text-align: center;

  margin-bottom: 5px;

  color: white;

  text-shadow:
    0 1px 4px black,
    0 1px 8px black;

}


/* =========================
   HOVER
========================= */

#five:hover {

  transform: scale(1.05);

  box-shadow:
    0 0 8px hwb(27 34% 0%);

}


#five1:hover {

  transform: scale(1.05);

  box-shadow:
    0 0 8px hwb(0 6% 7%);

}


#five2:hover {

  transform: scale(1.05);

  box-shadow:
    0 0 8px hwb(8 21% 2%);

}


#five3:hover {

  transform: scale(1.05);

  box-shadow:
    0 0 8px hwb(0 31% 60%);

}


#five4:hover {

  transform: scale(1.05);

  box-shadow:
    0 0 8px white;

}


#five5:hover {

  transform: scale(1.05);

  box-shadow:
    0 0 8px darkorange;

}


#five6:hover {

  transform: scale(1.02);

  box-shadow:
    0 0 8px grey;

}


/* =========================
   RECENTLY PLAYED
========================= */

#recentlyPlayed {

  width: 100%;

  margin-top: 25px;

  padding-bottom: 80px;

}


#recentTitle {

  color: white;

  margin-left: 5px;

}


#recentSongs {

  width: 100%;

}


/* =========================
   CUSTOM SONG CARD
========================= */

.song-card {

  display: flex;

  align-items: center;

  gap: 12px;

  width: calc(100% - 20px);

  margin: 10px auto;

  padding: 10px;

  box-sizing: border-box;

  background:
    rgba(0, 0, 0, 0.50);

  border:
    1px solid
    rgba(255,255,255,0.15);

  border-radius: 12px;

  color: white;

  cursor: pointer;

  transition:
    background 0.2s ease,
    transform 0.2s ease;

}


.song-card:hover {

  background:
    rgba(255,255,255,0.08);

}


.song-card:active {

  transform: scale(0.98);

}


/* =========================
   COVER
========================= */

.song-card img {

  width: 65px;

  height: 65px;

  flex-shrink: 0;

  object-fit: cover;

  border-radius: 8px;

}


/* =========================
   SONG INFORMATION
========================= */

.song-info {

  flex: 1;

  min-width: 0;

}


.song-title {

  font-size: 17px;

  font-weight: bold;

  color: white;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

}


.song-artist {

  font-size: 13px;

  color: white;

  opacity: 0.75;

  margin-top: 4px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

}


/* =========================
   CARD PLAY BUTTON
========================= */

.card-play {

  width: 42px;

  height: 42px;

  flex-shrink: 0;

  border: none;

  border-radius: 50%;

  background:
    rgba(255,255,255,0.12);

  color: white;

  display: flex;

  align-items: center;

  justify-content: center;

  cursor: pointer;

}


.card-play:hover {

  background:
    rgba(255,255,255,0.22);

}


/* =========================
   MESSAGES
========================= */

#loading,
#noRecent {

  color: white;

  text-align: center;

  margin-top: 20px;

}


/* =========================
   CUSTOM PLAYER
========================= */

#customPlayer {

  position: fixed;

  left: 0;

  right: 0;

  bottom: 0;

  width: 100%;

  height: 100vh;

  box-sizing: border-box;

  background:
    rgba(5,5,5,0.98);

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

  z-index: 2000;

  display: flex;

  flex-direction: column;

  align-items: center;

  padding:
    20px;

  opacity: 0;

  visibility: hidden;

  transform:
    translateY(100%);

  transition:
    0.3s ease;

}


#customPlayer.show {

  opacity: 1;

  visibility: visible;

  transform:
    translateY(0);

}


/* =========================
   PLAYER TOP
========================= */

.playerTop {

  width: 100%;

  display: flex;

  align-items: center;

  justify-content:
    space-between;

  color: white;

  font-size: 13px;

  font-weight: bold;

}


.playerTop button {

  width: 35px;

  height: 35px;

  border: none;

  background: none;

  color: white;

  font-size: 20px;

  cursor: pointer;

}


/* =========================
   PLAYER COVER
========================= */

.playerCoverBox {

  width: min(75vw, 330px);

  height: min(75vw, 330px);

  margin-top: 55px;

  border-radius: 18px;

  overflow: hidden;

  box-shadow:
    0 15px 40px
    rgba(0,0,0,0.5);

}


#playerCover {

  width: 100%;

  height: 100%;

  object-fit: cover;

}


/* =========================
   PLAYER DETAILS
========================= */

.playerDetails {

  width: min(90%, 500px);

  margin-top: 30px;

}


#playerTitle {

  color: white;

  font-size: 22px;

  margin: 0;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

}


#playerArtist {

  color: silver;

  font-size: 14px;

  margin-top: 7px;

}


/* =========================
   PROGRESS
========================= */

.progressArea {

  width: min(90%, 500px);

  margin-top: 25px;

}


#progress {

  display: block;

  width: 100%;

  height: 5px;

  margin:
    0 auto;

  appearance: none;

  -webkit-appearance: none;

  border-radius: 10px;

  background: #555;

}


#progress::-webkit-slider-thumb {

  appearance: none;

  -webkit-appearance: none;

  width: 14px;

  height: 14px;

  background: white;

  border-radius: 50%;

  cursor: pointer;

}


#progress::-moz-range-thumb {

  width: 14px;

  height: 14px;

  background: white;

  border: none;

  border-radius: 50%;

  cursor: pointer;

}


.timeRow {

  display: flex;

  justify-content:
    space-between;

  color: silver;

  font-size: 11px;

  margin-top: 7px;

}


/* =========================
   PLAYER CONTROLS
========================= */

.playerControls {

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 35px;

  margin-top: 25px;

}


.playerControl {

  border: none;

  background: none;

  color: white;

  display: flex;

  align-items: center;

  justify-content: center;

  cursor: pointer;

}


.mainPlay {

  width: 58px;

  height: 58px;

  border: none;

  border-radius: 50%;

  background: white;

  color: black;

  display: flex;

  align-items: center;

  justify-content: center;

  cursor: pointer;

}


/* =========================
   VOLUME
========================= */

.volumeBox {

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 8px;

  width: 100%;

  margin-top: 15px;

}


#volumeIcon {

  font-size: 17px;

  cursor: pointer;

}


#volume {

  width: 80px;

  height: 5px;

  appearance: none;

  -webkit-appearance: none;

  border-radius: 10px;

  background: #555;

}


#volume::-webkit-slider-thumb {

  appearance: none;

  -webkit-appearance: none;

  width: 14px;

  height: 14px;

  background: white;

  border-radius: 50%;

  cursor: pointer;

}


#volume::-moz-range-thumb {

  width: 14px;

  height: 14px;

  background: white;

  border: none;

  border-radius: 50%;

  cursor: pointer;

}


/* =========================
   BOTTOM NAVIGATION
========================= */

#down {

  position: fixed;

  bottom: 0;

  left: 0;

  width: 100%;

  height: 40px;

  box-sizing: border-box;

  background: #212121;

  display: flex;

  flex-direction: row;

  align-items: center;

  justify-content: space-between;

  z-index: 1000;

  padding: 5px;

}


#home {

  font-size: 35px;

  margin-left: 10px;

  line-height: 1;

  color: silver;

}


.pre {

  margin-right: 10px;

}
.none{
  background:none;
  border:none;
  }
button {
  position: relative;
}

button:active::after {
  content: "";
  position: absolute;
  left: 7px;
  right: 7px;
  top: 0;
  bottom: 0;
  border: 1px solid silver;
  border-radius: 3px;
  pointer-events: none;
}
#down h4 {

  margin: 0;

  color: black;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 45px;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

      0 8px;

  #five,

    width: 60px;

  .song-title {

    font-size: 16px;

  }


  .song-artist {

    font-size: 12px;

  }


  .playerCoverBox {

    width: 70vw;

    height: 70vw;

    margin-top: 35px;

  }


  .playerDetails {

    margin-top: 22px;

  }


  .playerControls {

    gap: 30px;

  }

    }

    /* =========================
       RECENTLY PLAYED
    ========================= */

    #recentlyPlayed {
      width: 100%;
      margin-top: 25px;

    }


    /* =========================

    ========================= */

    .song-card img {

      width: 65px;

    .song-info {

    }


    /* =========================
       CUSTOM PLAY BUTTON
    ========================= */

    .recent-play {

      width: 42px;

      border-radius: 50%;

      background: rgba(255,255,255,0.15);

      display: flex;

    /* =========================

    ========================= */

    #recentAudio {

    /* =========================
       MESSAGES
    ========================= */

    #noRecent {

      color: white;

      text-align: center;

      margin-top: 20px;

    }

  </style>

<script src="theme.js"></script>
  <script>


    /* =========================
       SUPABASE
    ========================= */

  const SUPABASE_URL =
  "https://ljmqyigdesrftfphiglw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_AMFZFIODLrc7YIF0SUAh0w_ZlQuONWn";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

    /* =========================
       VARIABLES
    ========================= */

    let allSongs = [];

    let currentSong = null;


    const recentAudio =
      document.getElementById(
        "recentAudio"
      );


    /* =========================
       LOAD SONGS
    ========================= */

    async function loadSongs() {

      const { data, error } =
        await supabaseClient
          .from("songs")
          .select("*")
          .order("created_at", {
            ascending: false
          });


      if (error) {

        console.error(
          "Error loading songs:",
          error
        );

        return;

      }


      allSongs = data || [];


      displayRecentlyPlayed();

    }


    /* =========================
       GENRE NAVIGATION
    ========================= */


function music() {
  window.location.href = "language.html?lang=Telugu";
}

function music1() {
  window.location.href = "language.html?lang=Hindi";
}

function music2() {
  window.location.href = "language.html?lang=English";
}

function music3() {
  window.location.href = "language.html?lang=Tamil";
}

function music4() {
  window.location.href = "language.html?lang=Malayalam";
}

function music5() {
  window.location.href = "language.html?lang=Kannada";
}
    /* =========================
       PLAY RECENT SONG
    ========================= */

    function playRecentSong(song) {

      currentSong = song;


      /*
        If the same song is already loaded,
        just toggle play/pause.
      */

      if (
        recentAudio.src === song.audio_url
      ) {

        if (recentAudio.paused) {

          recentAudio.play();

        } else {

          recentAudio.pause();

        }

        return;

      }


      /*
        New song
      */

      recentAudio.pause();

      recentAudio.src =
        song.audio_url;

      recentAudio.load();


      recentAudio.play()
        .catch(error => {

          console.error(
            "Could not play song:",
            error
          );

        });


      saveRecentlyPlayed(song);

      updateRecentButtons();

    }


    /* =========================
       SAVE RECENTLY PLAYED
    ========================= */

    function saveRecentlyPlayed(song) {

      let recent =
        JSON.parse(
          localStorage.getItem(
            "vibeRecentlyPlayed"
          )
        ) || [];


      recent =
        recent.filter(
          item =>
            item.id !== song.id
        );


      recent.unshift(song);


      recent =
        recent.slice(0, 10);


      localStorage.setItem(
        "vibeRecentlyPlayed",
        JSON.stringify(recent)
      );


      /*
        Rebuild the list only after
        changing the saved order.
      */

      displayRecentlyPlayed();

    }


    /* =========================
       CREATE RECENT CARD
    ========================= */

    function createRecentCard(song) {

      const card =
        document.createElement("div");


      card.className =
        "song-card";


      /* COVER */

      const cover =
        document.createElement("img");


      cover.src =
        song.cover_url ||
        "https://via.placeholder.com/65";


      cover.alt =
        song.title || "Song";


      /* INFORMATION */

      const info =
        document.createElement("div");


      info.className =
        "song-info";


      const title =
        document.createElement("div");


      title.className =
        "song-title";


      title.textContent =
        song.title || "Unknown Song";


      const artist =
        document.createElement("div");


      artist.className =
        "song-artist";


      artist.textContent =
        song.artist || "Unknown Artist";


      info.appendChild(title);

      info.appendChild(artist);


      /* PLAY BUTTON */

      const button =
        document.createElement("button");


      button.className =
        "recent-play";


      button.dataset.songId =
        song.id;


      button.textContent =
        "▶";


      button.onclick =
        function(event) {

          event.stopPropagation();

          playRecentSong(song);

        };


      /* CARD CLICK */

      card.onclick =
        function() {

          playRecentSong(song);

        };


      card.appendChild(cover);

      card.appendChild(info);

      card.appendChild(button);


      return card;

    }


    /* =========================
       DISPLAY RECENTLY PLAYED
    ========================= */

    function displayRecentlyPlayed() {

      const container =
        document.getElementById(
          "recentSongs"
        );


      const noRecent =
        document.getElementById(
          "noRecent"
        );


      let recent =
        JSON.parse(
          localStorage.getItem(
            "vibeRecentlyPlayed"
          )
        ) || [];


      /*
        Remove songs that no longer
        exist in Supabase.
      */

      recent =
        recent.filter(
          recentSong =>
            allSongs.some(
              song =>
                song.id ===
                recentSong.id
            )
        );


      localStorage.setItem(
        "vibeRecentlyPlayed",
        JSON.stringify(recent)
      );


      container.innerHTML = "";


      if (
        recent.length === 0
      ) {

        noRecent.style.display =
          "block";

        return;

      }


      noRecent.style.display =
        "none";


      recent.forEach(song => {

        const card =
          createRecentCard(song);


        container.appendChild(card);

      });


      updateRecentButtons();

    }


    /* =========================
       UPDATE PLAY BUTTONS
    ========================= */

    function updateRecentButtons() {

      document
        .querySelectorAll(".recent-play")
        .forEach(button => {

          const id =
            Number(button.dataset.songId);


          if (
            currentSong &&
            currentSong.id === id &&
            !recentAudio.paused
          ) {

            button.textContent =
              "❚❚";

          } else {

            button.textContent =
              "▶";

          }

        });

    }


    /* =========================
       AUDIO EVENTS
    ========================= */

    recentAudio.addEventListener(
      "play",
      function() {

        updateRecentButtons();

      }
    );


    recentAudio.addEventListener(
      "pause",
      function() {

        updateRecentButtons();

      }
    );


    recentAudio.addEventListener(
      "ended",
      function() {

        updateRecentButtons();

      }
    );


    /* =========================
       SEARCH
    ========================= */

    document
      .getElementById("three")
      .addEventListener(
        "input",
        function() {


          const text =
            this.value
              .toLowerCase()
              .trim();


          const container =
            document.getElementById(
              "recentSongs"
            );


          const noRecent =
            document.getElementById(
              "noRecent"
            );


          if (!text) {

            displayRecentlyPlayed();

            return;

          }


          const results =
            allSongs.filter(song => {

              const title =
                (song.title || "")
                  .toLowerCase();


              const artist =
                (song.artist || "")
                  .toLowerCase();


              const album =
                (song.album || "")
                  .toLowerCase();


              return (
                title.includes(text) ||
                artist.includes(text) ||
                album.includes(text)
              );

            });


          container.innerHTML = "";


          if (
            results.length === 0
          ) {

            noRecent.style.display =
              "block";

            noRecent.textContent =
              "No songs found.";

            return;

          }


          noRecent.style.display =
            "none";


          results.forEach(song => {

            const card =
              createRecentCard(song);


            container.appendChild(card);

          });


          updateRecentButtons();

        }
      );


    /* =========================
       REALTIME
    ========================= */

    supabaseClient
      .channel("songs-realtime")

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "songs"
        },

        payload => {

          console.log(
            "Database changed:",
            payload.eventType
          );


          loadSongs();

        }

      )

      .subscribe();


    /* =========================
       START
    ========================= */

    loadSongs();


  </script>
